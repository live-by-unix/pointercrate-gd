name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: macos-arm64
            geode_platform: mac-arm
            runner: macos-latest
          - platform: macos-x86_64
            geode_platform: mac-intel
            runner: macos-latest
          - platform: windows-x86_64
            geode_platform: windows
            runner: windows-latest
          - platform: android-arm64-v8a
            geode_platform: android64
            runner: ubuntu-latest
          - platform: android-armeabi-v7a
            geode_platform: android32
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install geode-sdk/geode/geode-cli
          elif [ "$RUNNER_OS" == "Windows" ]; then
            winget install GeodeSDK.GeodeCLI
          else
            wget -qO- https://github.com/geode-sdk/cli/releases/latest/download/geode-cli_linux_x86_64.tar.gz | tar xz
            sudo mv geode /usr/local/bin/
          fi
          geode sdk install
        shell: bash

      - name: Install Android NDK (if needed)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

      - name: Build
        run: |
          if [ -n "$ANDROID_NDK_ROOT" ]; then
            geode build -p ${{ matrix.geode_platform }} --ndk $ANDROID_NDK_ROOT
          else
            geode build -p ${{ matrix.geode_platform }}
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointercrate-gd-${{ matrix.platform }}
          path: build-*/livebyunix.pointercrate-gd.geode

  release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -name "*.geode" -exec sha256sum {} \; > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.geode
            artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
