name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-matrix:
    strategy:
      matrix:
        include:
          - platform: macos-arm64
            geode_platform: macos64
            runner: macos-latest
            output_dir: build-macos64
          - platform: windows-x86_64
            geode_platform: windows64
            runner: windows-latest
            output_dir: build-windows64
          - platform: android-arm64-v8a
            geode_platform: android64
            runner: ubuntu-latest
            output_dir: build-android64
          - platform: android-armeabi-v7a
            geode_platform: android32
            runner: ubuntu-latest
            output_dir: build-android32

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Geode CLI (macOS)
        if: matrix.runner == 'macos-latest'
        run: |
          brew tap geode-sdk/geode
          brew install geode-cli
          geode sdk install

      - name: Install Geode CLI (Windows)
        if: matrix.runner == 'windows-latest'
        run: |
          winget install GeodeSDK.GeodeCLI --exact
          geode sdk install
        shell: pwsh

      - name: Install Geode CLI (Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          mkdir -p /tmp/geode
          cd /tmp/geode
          curl -sL https://github.com/geode-sdk/cli/releases/latest/download/geode-cli_linux_x86_64.tar.gz | tar xz
          sudo mv geode /usr/local/bin/
          geode sdk install

      - name: Install Android NDK (Linux)
        if: matrix.runner == 'ubuntu-latest'
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux-x86_64.zip
          unzip -q android-ndk-r25c-linux-x86_64.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

      - name: Build
        run: |
          if [ -n "${{ env.ANDROID_NDK_ROOT }}" ]; then
            geode build -p ${{ matrix.geode_platform }} --ndk ${{ env.ANDROID_NDK_ROOT }}
          else
            geode build -p ${{ matrix.geode_platform }}
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointercrate-gd-${{ matrix.platform }}
          path: ${{ matrix.output_dir }}/livebyunix.pointercrate-gd.geode

  release:
    runs-on: ubuntu-latest
    needs: [build-matrix]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release_files
          find artifacts -name "*.geode" -exec cp {} release_files/ \;
          cd release_files
          sha256sum *.geode > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release_files/*.geode
            release_files/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
