name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          brew tap geode-sdk/geode
          brew install geode-cli
          geode sdk install

      - name: Build macOS ARM64
        run: |
          geode build -p macos64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointercrate-gd-macos-arm64
          path: build-macos64/livebyunix.pointercrate-gd.geode

  build-windows-x86_64:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          winget install GeodeSDK.GeodeCLI --exact
          geode sdk install
        shell: pwsh

      - name: Build Windows x86_64
        run: |
          geode build -p windows64
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointercrate-gd-windows-x86_64
          path: build-windows64/livebyunix.pointercrate-gd.geode

  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          mkdir -p /tmp/geode
          cd /tmp/geode
          curl -sL https://github.com/geode-sdk/cli/releases/latest/download/geode-cli_linux_x86_64.tar.gz | tar xz
          sudo mv geode /usr/local/bin/
          geode sdk install

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux-x86_64.zip
          unzip -q android-ndk-r25c-linux-x86_64.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

      - name: Build Android ARM64
        run: |
          geode build -p android64 --ndk $ANDROID_NDK_ROOT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointercrate-gd-android-arm64
          path: build-android64/livebyunix.pointercrate-gd.geode

  build-android-armeabi-v7a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          mkdir -p /tmp/geode
          cd /tmp/geode
          curl -sL https://github.com/geode-sdk/cli/releases/latest/download/geode-cli_linux_x86_64.tar.gz | tar xz
          sudo mv geode /usr/local/bin/
          geode sdk install

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux-x86_64.zip
          unzip -q android-ndk-r25c-linux-x86_64.zip
          echo "ANDROID_NDK_ROOT=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

      - name: Build Android ARMv7
        run: |
          geode build -p android32 --ndk $ANDROID_NDK_ROOT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointercrate-gd-android-armeabi-v7a
          path: build-android32/livebyunix.pointercrate-gd.geode
